[project]
name = "p3cv"
dynamic = ["version"]
description = "Product 3D drawing -> canvas mechanism animation, 4K voice-over videos (16:9 + 9:16) and single-HTML landing page"
requires-python = ">=3.9"
dependencies = ["playwright==1.49.1", "edge-tts>=6.1.12", "Pillow>=10.0"]

[project.scripts]
p3cv = "p3cv.cli:main"

[tool.setuptools]
packages = ["p3cv", "p3cv.stages", "p3cv.adapters", "p3cv.sinks", "p3cv.tts"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
