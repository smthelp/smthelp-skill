<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-k="seo_title">{{SEO_TITLE}}</title>
<meta name="description" content="{{SEO_DESC}}"><meta name="keywords" content="{{SEO_KEYS}}"><meta name="robots" content="index,follow">
<meta name="generator" content="smt-evaluation-web-page {{SKILL_VERSION}}">
<link rel="canonical" href="{{URL}}">{{HREFLANG}}
<meta property="og:type" content="article"><meta property="og:title" content="{{SEO_TITLE}}"><meta property="og:description" content="{{SEO_DESC}}"><meta property="og:url" content="{{URL}}"><meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="{{THEME_COLOR}}">
<script type="application/ld+json">{{JSONLD}}</script>
<style>{{PALETTE}}{{CSS}}</style></head><body>
<header class="top"><div class="wrap"><a href="#top"><img class="logo" src="{{LOGO}}" alt="{{BRAND}}"></a>
<nav class="menu" aria-label="sections">{{NAV}}</nav>
<div class="ctrl"><div class="lang"><button id="langBtn" aria-haspopup="true" title="{{UI_LANG}}">🌐 <span id="langCur">EN</span></button><div id="langMenu" hidden>{{LANG_BUTTONS}}</div></div>
<button id="th" data-kt="ui_theme" title="{{UI_THEME}}"><span id="themeIcon">☀</span></button><button onclick="print()" title="{{UI_PRINT}}">⎙</button></div></div></header>
<main>
{{HERO}}
{{SECTIONS}}
</main>
<div id="modal" hidden role="dialog" aria-modal="true"><div class="mbox"><button id="mclose" aria-label="close">×</button><div id="mbody"></div></div></div>
<div id="arts" hidden>{{ARTICLES}}</div>
<footer><div class="wrap"><div class="grid">
<div><img src="{{LOGO}}" alt="{{BRAND}}"><p data-k="foot_about">{{FOOT_ABOUT}}</p><div class="soc">{{SOCIALS}}</div></div>
<div><p><a href="{{CATALOG_BOARD}}" target="_blank" rel="noopener" data-k="foot_cat">{{FOOT_CAT}}</a></p><p><a href="{{PHOTO_SITE}}" target="_blank" rel="noopener" data-k="foot_ph">{{FOOT_PH}}</a></p></div>
<div><p><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p><p><a href="{{WHATSAPP}}">WhatsApp {{PHONE}}</a></p></div>
</div><p class="disc">© {{YEAR}} <span data-k="foot_rights">{{FOOT_RIGHTS}}</span></p></div></footer>
<script>var I18N={{I18N}};var CFG={{CFG}};</script>
<script>{{JS}}</script>
{{CHATWOOT}}
</body></html>
